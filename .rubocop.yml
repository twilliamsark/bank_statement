# Omakase Ruby styling for Rails
inherit_gem: { rubocop-rails-omakase: rubocop.yml }

inherit_mode:
  merge:
    - Exclude

AllCops:
  NewCops: enable
  SuggestExtensions: false
  Exclude:
    - bin/bundle
    - db/schema.rb
    - db/*_schema.rb
    - log/**/*
    - node_modules/**/*
    - storage/**/*
    - tmp/**/*
    - vendor/**/*
